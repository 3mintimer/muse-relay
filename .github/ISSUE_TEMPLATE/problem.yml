name: 操作で困った・不具合
description: うまく動かない操作を知らせる
body:
  - type: markdown
    attributes:
      value: |
        このIssueは公開されます。トークン、接続設定、会話、音声、写真、氏名は貼らないでください。
        GitHub登録なし・非公開の受付を使う場合は、[ガイドの要望受付](https://muse-relay-guide.spicy-cup-4319.chatgpt.site/#feedback)へ進んでください。
  - type: textarea
    id: operation
    attributes:
      label: どの操作で困りましたか
      placeholder: 例：ホームからスペースを開き、項目をタップしたとき
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 起きたこと・期待したこと
      description: 操作順と、画面に出た短いエラーがあれば記載してください。実際の会話内容は不要です。
    validations:
      required: true
  - type: dropdown
    id: relay
    attributes:
      label: 中継方式
      options:
        - わからない
        - GitHub Gist
        - Muse Gadget SDK
  - type: input
    id: version
    attributes:
      label: アプリのバージョン（わかる場合）
      placeholder: 設定画面のバージョン
  - type: dropdown
    id: surface
    attributes:
      label: 確認した画面・機器
      options:
        - Even G2実機
        - スマートフォンのEvenアプリ
        - ブラウザー
        - Simulator
        - わからない
