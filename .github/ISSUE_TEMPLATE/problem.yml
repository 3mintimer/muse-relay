name: Problem or bug
description: Report an action that did not work as expected
body:
  - type: markdown
    attributes:
      value: |
        This Issue will be public. Do not paste tokens, connection settings, conversations, audio, photos, or names.
        For a private submission without a GitHub account, use the [guide feedback form](https://muse-relay-guide.spicy-cup-4319.chatgpt.site/#feedback).
        [日本語のフォーム](https://github.com/3mintimer/muse-relay/issues/new?template=problem.ja.yml)
  - type: textarea
    id: operation
    attributes:
      label: Which action caused the problem?
      placeholder: For example, opening a Space from Home and tapping an item.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
      description: Include the steps and any short error shown on screen. Actual conversation content is unnecessary.
    validations:
      required: true
  - type: dropdown
    id: relay
    attributes:
      label: Relay method
      options:
        - Not sure
        - GitHub Gist
        - Muse Gadget SDK
  - type: input
    id: version
    attributes:
      label: App version (if known)
      placeholder: Version shown in Settings
  - type: dropdown
    id: surface
    attributes:
      label: Where did you check this?
      options:
        - Physical Even G2
        - Even app on a phone
        - Browser
        - Simulator
        - Not sure
