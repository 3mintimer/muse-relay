name: Setup or usage question
description: Ask which setting or action to use
body:
  - type: markdown
    attributes:
      value: |
        This Issue will be public. Do not include full connection URLs, tokens, settings JSON, or actual conversations.
        Describe anything still unclear after reading the [guide](https://muse-relay-guide.spicy-cup-4319.chatgpt.site/).
        To send without a GitHub account, use the [feedback form](https://muse-relay-guide.spicy-cup-4319.chatgpt.site/#feedback).
        [日本語のフォーム](https://github.com/3mintimer/muse-relay/issues/new?template=question.ja.yml)
  - type: textarea
    id: question
    attributes:
      label: What do you want to do, and where did you get stuck?
      placeholder: For example, after setting up Gist, I do not know which screen to return to in the app.
    validations:
      required: true
  - type: dropdown
    id: relay
    attributes:
      label: Relay method
      options:
        - Not selected / not sure
        - GitHub Gist
        - Muse Gadget SDK
  - type: textarea
    id: tried
    attributes:
      label: Steps already tried (optional)
