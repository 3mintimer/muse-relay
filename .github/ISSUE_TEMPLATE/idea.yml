name: Idea or improvement
description: Describe what you want to do or which steps you want to reduce
body:
  - type: markdown
    attributes:
      value: |
        This Issue will be public. No coding or development knowledge is needed. Do not include personal information, conversations, or connection keys.
        To send privately, use the [guide feedback form](https://muse-relay-guide.spicy-cup-4319.chatgpt.site/#feedback).
        [日本語のフォーム](https://github.com/3mintimer/muse-relay/issues/new?template=idea.ja.yml)
  - type: textarea
    id: use
    attributes:
      label: What do you want to do, and in which situation?
      placeholder: For example, check only the next event in a selected Space while away from home.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What is difficult with the current steps? (optional)
      description: You do not need to know how to implement a solution.
  - type: textarea
    id: outcome
    attributes:
      label: What would make this easier to use? (optional)
