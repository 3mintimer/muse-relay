name: こう使いたい・改善案
description: 使いたい場面や、減らしたい手順を知らせる
body:
  - type: markdown
    attributes:
      value: |
        このIssueは公開されます。開発の知識やコードは不要です。個人情報、会話、接続キーは含めないでください。
        非公開で送る場合は[ガイドの要望受付](https://muse-relay-guide.spicy-cup-4319.chatgpt.site/#feedback)を使えます。
  - type: textarea
    id: use
    attributes:
      label: どんな場面で、何をしたいですか
      placeholder: 例：外出中に、選んだスペースの次の予定だけ確認したい
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 今の操作で困ること（任意）
      description: 実現方法がわからなくても、そのまま記載できます。
  - type: textarea
    id: outcome
    attributes:
      label: どうなれば使いやすいですか（任意）
